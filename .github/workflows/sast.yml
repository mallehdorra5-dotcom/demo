name: Source Code Vulnerability Scan

on:
  push:
    branches:
      - main

jobs:
  sast:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
       uses: actions/checkout@11d5960e1a9b1e8a4f1e9e9c6f0d8e8f7c6b5a4

      - name: Source Code Vulnerability Scan
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            semgrep/semgrep \
            semgrep scan --config auto /src
